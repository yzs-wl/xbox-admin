server:
  port: 8080

spring:
  application:
    name: xbox-admin
  # ==================== Nacos微服务配置（默认关闭，独立运行不受影响） 
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        metadata:
          env: ${NACOS_SERVICE_ENV:default}
          version: ${NACOS_SERVICE_VERSION:1.0.0}
  datasource:
    #url: jdbc:mysql://localhost:3306/xbox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    #driver-class-name: com.mysql.cj.jdbc.Driver
    #username: root
    #password: root
    url: jdbc:h2:file:./data/xbox-admin
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.MySQLDialect
        dialect: org.hibernate.dialect.H2Dialect
        bytecode:
          provider: none
  sql:
    init:
      mode: never
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
    # MCP Server 配置（由 spring-ai-starter-mcp-server-webmvc 自动配置）
    mcp:
      server:
        name: ${MCP_SERVER_NAME:xbox-mcp-server}
        version: ${MCP_SERVER_VERSION:1.0.0}
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
  # 邮件通知配置（NotificationService EMAIL 渠道）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Redis配置（仅在xbox.session.store-type=redis时生效）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}

flowable:
  async-executor-activate: false
  # Set to false: schema initialization is handled by FlowableSchemaAutoConfiguration
  # which executes META-INF/db/flowable-mysql-all-create.sql before ProcessEngine starts.
  # This avoids conflicts between Flowable's built-in DDL and our custom SQL script.
  database-schema-update: true
  history-level: full

jwt:
  # 【安全警告】JWT密钥必须通过环境变量JWT_SECRET设置！
  # 系统启动时会校验密钥强度，弱密钥/默认密钥将导致启动警告。
  # 绝不应在生产环境使用默认值，攻击者可用此密钥伪造任意JWT Token。
  secret: ${JWT_SECRET:XboxAdminSecretKeyForJwtTokenGeneration2024VeryLongSecretKey}
  expiration: ${JWT_EXPIRATION:86400000}
  # JWT时钟偏移容忍秒数，防止客户端/服务器时间差导致误判过期
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}

# 安全配置
xbox:
  # 会话存储配置
  session:
    # 存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${SESSION_STORE_TYPE:memory}
  security:
    # === 总开关：设为 false 关闭全部安全功能（方便性能测试） ===
    enabled: true
    # === 细粒度开关（仅在 enabled=true 时生效） ===
    # 是否启用请求/响应体加密
    encrypt-body: true
    # 是否启用防篡改签名校验
    sign-enabled: true
    # 是否启用防重放（timestamp + nonce）
    replay-enabled: true
    # 是否启用 Host 头校验（防 Host 头篡改）
    host-check-enabled: true
    # 是否启用 XSS 检测
    xss-enabled: true
    # 是否启用 SQL 注入检测
    sql-injection-enabled: true
    # 是否启用安全响应头（CSP/HSTS/X-Frame-Options 等）
    security-headers-enabled: true
    # 【安全警告】以下密钥必须通过环境变量设置，默认值仅供开发/测试环境使用！
    # 生产环境绝不应使用默认值，否则加密和签名可被攻击者完全破解。
    # HMAC 签名密钥（生产环境请通过环境变量 SIGN_KEY 设置）
    sign-key: ${SIGN_KEY:XboxSignKey2024SecretForHmac}
    # 数据加密 AES 密钥（生产环境请通过环境变量 AES_KEY 设置）
    aes-key: ${AES_KEY:XboxAesKey2024SecretForData}
    # 允许的 Host 头白名单（防 Host 头篡改）
    allowed-hosts: localhost,127.0.0.1
    # CORS 允许的来源域名
    cors-allowed-origins: http://localhost:3000,http://localhost:8080
    # 登录安全策略
    login-policy:
      # 是否启用登录失败锁定
      lock-enabled: ${LOGIN_LOCK_ENABLED:true}
      # 连续登录失败次数阈值
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      # 账号锁定时长（分钟）
      lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:30}
      # 是否启用密码复杂度校验
      password-complexity-enabled: ${PASSWORD_COMPLEXITY_ENABLED:true}
      # 密码最小长度
      password-min-length: ${PASSWORD_MIN_LENGTH:8}
      # 密码必须包含大写字母
      password-require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      # 密码必须包含小写字母
      password-require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      # 密码必须包含数字
      password-require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
      # 密码必须包含特殊字符
      password-require-special: ${PASSWORD_REQUIRE_SPECIAL:true}
      # 密码历史校验：禁止重复使用最近 N 次密码（0 表示不校验）
      password-history-count: ${PASSWORD_HISTORY_COUNT:5}
      # 密码过期天数（0 表示不过期）
      password-expire-days: ${PASSWORD_EXPIRE_DAYS:0}
      # 是否启用登录验证码（图形点击验证，设为 false 可关闭验证码）
      captcha-enabled: ${CAPTCHA_ENABLED:false}
    # 通用 API 限流配置
    rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
      # 每用户每周期最大请求数
      max-requests: ${API_RATE_LIMIT_MAX:60}
      # 填充周期（秒）
      refill-seconds: ${API_RATE_LIMIT_REFILL:60}

  # 幂等性防重复提交配置
  idempotent:
    # 是否启用幂等性校验
    enabled: ${IDEMPOTENT_ENABLED:true}
    # 幂等键有效期（秒）
    expire-seconds: ${IDEMPOTENT_EXPIRE_SECONDS:300}
    # 需要幂等校验的路径模式（逗号分隔）
    include-patterns: ${IDEMPOTENT_INCLUDE_PATTERNS:POST:/api/users,POST:/api/roles,POST:/api/organizations,POST:/api/employees,POST:/api/groups,POST:/api/auths,POST:/api/tenants}

  # SSO 单点登录配置
  sso:
    # 是否启用 SSO（默认关闭，需配置 provider 后启用）
    enabled: ${SSO_ENABLED:false}
    # SSO 登录后自动创建本地用户
    auto-create-user: ${SSO_AUTO_CREATE_USER:true}
    # SSO 登录后自动分配的默认角色编码（逗号分隔）
    default-roles: ${SSO_DEFAULT_ROLES:user}
    # SSO 提供方配置（每个 provider 为一个独立的配置块）
