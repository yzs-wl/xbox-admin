    #     type: oauth2
    #     client-id: ${SSO_DINGTALK_APP_ID:}
    #     client-secret: ${SSO_DINGTALK_APP_SECRET:}
    #     authorization-uri: https://login.dingtalk.com/oauth2/auth?redirect_uri={redirect_uri}&response_type=code&client_id={client_id}&scope=openid&prompt=consent
    #     token-uri: https://api.dingtalk.com/v1.0/oauth2/access_token
