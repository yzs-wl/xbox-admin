    providers: {}

  crypto:
    # 【安全警告】以下密钥必须通过环境变量设置！
    aes-key: ${CRYPTO_AES_KEY:default-aes-key-please-change-in-production}
    hash-salt: ${CRYPTO_HASH_SALT:default-hash-salt-please-change}

  # AI 对话速率限制
  chat:
    rate-limit:
      enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
      send:
        max-tokens: ${CHAT_RATE_LIMIT_SEND_MAX:30}       # 每用户每分钟最多 30 次非流式请求
        refill-seconds: ${CHAT_RATE_LIMIT_SEND_REFILL:60}  # 令牌桶填充周期（秒）
      stream:
        max-tokens: ${CHAT_RATE_LIMIT_STREAM_MAX:15}       # 每用户每分钟最多 15 次流式请求
        refill-seconds: ${CHAT_RATE_LIMIT_STREAM_REFILL:60}
    # ==================== 在线/离线模式 ====================
    # 离线模式：开启后聊天接口不再构建/连接大模型，直接走本地离线兜底（只读知识库/工具直调），
    # 彻底跳过网络探测，适合纯内网/无外网/模型全部不可达的环境。
    offline-mode: ${CHAT_OFFLINE_MODE:false}
    # ==================== 大模型降级容错 ====================
    # 说明：模型不可用时的三级降级 —— ① 故障转移到备用模型；② 本地知识库离线检索直答；③ 明确报错提示。
    # 设为 false 可整体关闭降级体系，回到改造前"一次失败即报错"的行为。
    fallback:
      enabled: ${CHAT_FALLBACK_ENABLED:true}
      # 单次请求最多尝试多少个候选模型（含首选）。模型多时避免串行重试拖慢响应
      max-attempts: ${CHAT_FALLBACK_MAX_ATTEMPTS:3}
      # 熔断器：连续失败多少次后熔断该模型
      circuit-failure-threshold: ${CHAT_FALLBACK_CIRCUIT_THRESHOLD:2}
      # 熔断器：熔断后冷却多少秒（冷却结束放行一个探路请求）
      circuit-open-seconds: ${CHAT_FALLBACK_CIRCUIT_OPEN_SECONDS:60}
      # 本地离线回答返回的知识片段条数
      offline-top-k: ${CHAT_FALLBACK_OFFLINE_TOP_K:3}
      # ==================== 离线工具直调（本地意图路由） ====================
      # 说明：模型全不可用时，用纯本地算法把问句匹配到已注册工具并直接执行（不经过大模型）。
      # 安全约束：默认只允许读类工具；必填参数抽不全或存在歧义时不执行，改为提示用户补齐/澄清。
      offline-tools:
        enabled: ${CHAT_FALLBACK_OFFLINE_TOOLS_ENABLED:true}
        # 是否允许离线直调写操作工具（add/edit/delete/assign 等）。默认 false，强烈不建议在生产开启
        allow-write: ${CHAT_FALLBACK_OFFLINE_TOOLS_ALLOW_WRITE:false}
        # 命中最低分（0~1），调高可减少误执行，调低可提高命中率
        min-score: ${CHAT_FALLBACK_OFFLINE_TOOLS_MIN_SCORE:0.45}
        # 问句被工具描述覆盖的最低比例，避免"查一下"这类短句被偶然匹配
        min-coverage: ${CHAT_FALLBACK_OFFLINE_TOOLS_MIN_COVERAGE:0.5}
        # 前两名分差小于该值时判定为歧义，不执行
        ambiguity-gap: ${CHAT_FALLBACK_OFFLINE_TOOLS_AMBIGUITY_GAP:0.05}
        # 工具返回结果展示的最大字符数
        max-result-chars: ${CHAT_FALLBACK_OFFLINE_TOOLS_MAX_RESULT:1500}

  # ==================== 大模型对话成本控制 ====================
  # 说明：启用后，普通用户只能选择对其可见(enabled+userVisible)且角色允许(allowedRoles)的模型，
  # 并对每用户施加 频率/并发/日·月 token 额度 限制，实时计量花费。
  # 限流/并发复用 chat 模块的 TokenStore（内存 / Redis 委托切换，由 spring.data.redis 是否配置决定）。
  cost-control:
    enabled: ${COST_CONTROL_ENABLED:true}
    # 单次请求最大输入字符数（超过直接拒绝，防止极端长文本烧钱）
    max-input-chars: ${COST_CONTROL_MAX_INPUT_CHARS:20000}
    # 每用户每分钟最大请求数
    rate-limit-per-minute: ${COST_CONTROL_RATE_LIMIT:10}
    # 每用户最大并发对话数
    concurrency-limit: ${COST_CONTROL_CONCURRENCY:3}
    # 默认每日 token 额度（全体用户通用；<=0 表示不限制）
    default-daily-token-quota: ${COST_CONTROL_DAILY_QUOTA:200000}
    # 默认每月 token 额度
    default-monthly-token-quota: ${COST_CONTROL_MONTHLY_QUOTA:5000000}
    # 各成本等级每千 token 默认单价（单位：分）
    price-per-1k-tokens:
      cheap: ${COST_CONTROL_PRICE_CHEAP:0.005}
      standard: ${COST_CONTROL_PRICE_STANDARD:0.02}
      premium: ${COST_CONTROL_PRICE_PREMIUM:0.15}

  # 调度任务安全配置
  scheduler:
    # 调度框架类型: spring(默认，使用Spring TaskScheduler) / xxl-job(使用xxl-job执行器)
    type: ${SCHEDULER_TYPE:spring}
    # 是否允许执行Shell脚本（默认关闭，存在安全风险）
    shell-enabled: ${SCHEDULER_SHELL_ENABLED:false}
    # xxl-job执行器配置（仅在type=xxl-job时生效）
    xxl-job:
      # xxl-job-admin管理后台地址
      admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8056/xxl}
      # xxl-job-admin登录用户名（可在xxl-job-admin中创建与xbox同名的用户）
      admin-username: ${XXL_JOB_ADMIN_USERNAME:admin}
      # xxl-job-admin登录密码（【安全警告】默认值仅供测试，生产环境必须设置强密码）
      admin-password: ${XXL_JOB_ADMIN_PASSWORD:123456}
      # 执行器通讯TOKEN（需与xxl-job-admin配置一致）
      access-token: ${XXL_JOB_ACCESS_TOKEN:}
      executor:
        # 执行器Appname（需与xxl-job-admin中配置一致）
        appname: ${XXL_JOB_EXECUTOR_APPNAME:xbox-executor}
        # 执行器注册地址（为空则自动获取）
        address: ${XXL_JOB_EXECUTOR_ADDRESS:}
        # 执行器IP（为空则自动获取）
        ip: ${XXL_JOB_EXECUTOR_IP:}
        # 执行器端口
        port: ${XXL_JOB_EXECUTOR_PORT:8080}
        # 执行器日志文件路径
        log-path: ${XXL_JOB_EXECUTOR_LOGPATH:/data/applogs/xxl-job/jobhandler}
        # 执行器日志保留天数
        log-retention-days: ${XXL_JOB_EXECUTOR_LOGRETENTIONDAYS:30}
        # xxl-job-admin中的执行器JobGroup ID（创建任务时使用）
        job-group-id: ${XXL_JOB_EXECUTOR_JOB_GROUP_ID:0}

  # Office文档解析服务配置（xbox-office远程服务）
  office:
    service-url: ${OFFICE_SERVICE_URL:http://localhost:8081/api}

  # 附件管理配置
  attachment:
    # 文件存储根路径
    base-path: ${ATTACHMENT_BASE_PATH:./data/attachments}
    # 默认存储类型: FILE_SYSTEM(文件系统) / DATABASE(数据库)
    default-storage-type: ${ATTACHMENT_STORAGE_TYPE:FILE_SYSTEM}
    # 单文件最大大小（MB）
    max-file-size-mb: ${ATTACHMENT_MAX_FILE_SIZE_MB:100}
    # 允许的文件扩展名（为空则不限制），逗号分隔
    allowed-extensions: ${ATTACHMENT_ALLOWED_EXTENSIONS:}
    # 禁止的文件扩展名，逗号分隔
    denied-extensions: ${ATTACHMENT_DENIED_EXTENSIONS:exe,bat,cmd,sh,js,vbs,com,scr,pif,msi,dll}
    # 可预览的文件类型（通过浏览器直接打开）
    # 【安全增强】移除 html/htm/svg 等可执行内容类型，防止存储型XSS攻击
    previewable-types: ${ATTACHMENT_PREVIEWABLE_TYPES:pdf,png,jpg,jpeg,gif,bmp,webp,txt}
    # xbox产生的附件存放路径（为空则使用base-path）
    xbox-storage-path: ${ATTACHMENT_XBOX_PATH:}

  # RAG向量检索配置
  rag:
    # 是否启用RAG向量检索
    enabled: ${RAG_ENABLED:true}
    # 向量存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${RAG_STORE_TYPE:memory}
    # 嵌入模型类型: simple(默认，确定性哈希嵌入，免费离线) / openai(使用OpenAI兼容API，精确但消耗Token)
    embedding-type: ${RAG_EMBEDDING_TYPE:simple}
    # OpenAI嵌入模型配置（仅在embedding-type=openai时生效）
    embedding:
      # 嵌入模型API地址（可与聊天模型使用不同地址）
      base-url: ${EMBEDDING_BASE_URL:}
      # 嵌入模型API密钥（为空则复用spring.ai.openai.api-key）
      api-key: ${EMBEDDING_API_KEY:}
      # 嵌入模型名称
      model: ${EMBEDDING_MODEL:text-embedding-3-small}

  # MCP Server 配置（对外提供MCP协议服务）
  mcp:
    server:
      name: ${MCP_SERVER_NAME:xbox-mcp-server}
      version: ${MCP_SERVER_VERSION:1.0.0}
      # 是否同时启用 Streamable HTTP 接入模式（默认仅 SSE）
      # 启用后，智能体可通过 SSE (/mcp/sse) 或 Streamable HTTP (/mcp) 两种方式接入
      streamable-enabled: ${MCP_STREAMABLE_ENABLED:true}

  # 流程引擎适配层：流程引擎可插拔（内置 Flowable 或 第三方 BPMN 引擎）
  # 设计要点：引擎语义（部署/实例/任务/历史/驳回/流程图/评论）走 ProcessEnginePort，
  #          由 FlowService 按 isRemote() 分叉；事件脚本、业务规则、业务键约定、
  #          表单视图配置、操作日志始终由 xbox 自己负责，因此换引擎不会丢失这些能力。
  # 注意：engine=embedded 时流程仍由内置 Flowable 执行，适配层不参与；
  #      engine=http 时流程真实落在第三方引擎，本地不再保留实例/任务/历史（趋势图改拉第三方）。
  flow:
    # 引擎类型: embedded(内置 Flowable) / http(第三方 BPMN 引擎)；此处默认 http
    engine: ${FLOW_ENGINE:embedded}
    # 外部引擎不可用时是否回退内置引擎。默认 false：宁可显式失败，
    # 因为回退会让"流程跑在第三方引擎上"的假设失真（实例/任务/历史实际落在本地库）
    fallback-to-embedded: ${FLOW_FALLBACK_TO_EMBEDDED:false}
    # 业务键分隔符：modelName:dataId / batch:modelName:batchId 是 xbox 与业务模型的契约，换引擎必须沿用
    business-key-separator: ${FLOW_BUSINESS_KEY_SEPARATOR::}
    http:
      # 第三方引擎基础地址；为空表示该适配器未启用（不影响启动，调用时才报错）
      base-url: ${FLOW_HTTP_BASE_URL:}
      # Bearer Token（生产环境建议通过环境变量注入）
      token: ${FLOW_HTTP_TOKEN:}
      # 自定义请求头，例如网关鉴权/多租户标识
      headers: {}
      # 连接/读取超时（毫秒）
      timeout-ms: ${FLOW_HTTP_TIMEOUT_MS:5000}
      # 厂商类型: generic / camunda / flowable-rest / activiti
      # 决定「默认端点路径 + 分页参数(firstResult/maxResults | start/size | page/size)
      #      + 响应解包(_embedded/page | data/total | content/totalElements)
      #      + 部署语义(JSON | multipart) + 挂起语义(POST /suspend | PUT {"suspended"|"action"})
      #      + 任务动作语义(每动作一端点 | 统一 POST + body.action)」
      # 未识别的取值会告警并退回 generic（避免"厂商名拼错"被伪装成"引擎不兼容"）。
      # 注意：各厂商预设只对齐上述结构性差异；查询过滤语义(state/keyword)与字段名
      #      仍需按实际引擎用 paths.* 与 field-mapping 覆盖。generic 为唯一开箱即用预设。
      vendor: ${FLOW_HTTP_VENDOR:generic}
      # 字段映射：本地字段 -> 第三方字段（仅顶层重命名）
      field-mapping: {}
      # 能力声明：第三方引擎缺什么必须在这里说清楚，调用方据此降级而不是抛异常。
      # 三项未配置时取"保守默认"：默认不假设具备 DI 流程图与任意节点驳回
      #（这两项是 Flowable 的强项，多数第三方引擎没有等价能力）。
      capability:
        bpmn-parsing: ${FLOW_CAP_BPMN_PARSING:true}
        diagram-generation: ${FLOW_CAP_DIAGRAM:false}
        activity-history: ${FLOW_CAP_ACTIVITY_HISTORY:true}
        task-comment: ${FLOW_CAP_TASK_COMMENT:true}
        arbitrary-rollback: ${FLOW_CAP_ARBITRARY_ROLLBACK:false}
        candidate-group: ${FLOW_CAP_CANDIDATE_GROUP:true}
        suspend-resume: ${FLOW_CAP_SUSPEND_RESUME:true}
        variable-query: ${FLOW_CAP_VARIABLE_QUERY:true}
      # 端点路径「覆盖项」：留空 = 沿用 xbox.flow.http.vendor 的预设。
      # 重要：不要把全部路径都写满 —— 那会把厂商预设整体覆盖掉，
      #       vendor 又退化成一个不产生行为差异的配置项。
      # 只写与预设不同的那几项即可（未写的自动取预设值），例如：
      #   paths:
      #     task-todo: /custom/tasks/todo
      #     task-done: /custom/tasks/done
      paths: {}

  # 主数据适配层：用户/角色/组织/岗位/员工/权限点 的来源可插拔（本地库 或 第三方系统）
  # 设计要点：按域混用（如组织与员工来自HR，角色与权限点仍由本平台维护）；
  #          单一事实源（同一域禁止双写，第三方为权威源时本平台只读）。
  #
  # 【重要】"读路径"与"数据落地"是两件事，切数据源时最容易踩坑：
  #   · provider/domains 只决定**读**走哪里：只有经由 MasterDataFacade/各 Port 的调用才实时查第三方；
  #     而"组织管理/岗位管理/职工管理"等管理页面读的是**本地投影表**（sys_organization/sys_position/...）；
  #   · 第三方数据进入本地表只有两条路：① 同步（拉：/api/master-data/sync/*；推：/api/master-data/webhook）；
  #     ② 登录时的 JIT 即时开户（仅用户域）。
  #   因此"配置指向了第三方但页面里一条数据都没有"通常不是配置错误，而是**还没同步**。
  #   默认已开启启动自动同步（见下方 sync-on-startup），也可随时手工触发全量同步：
  #     POST /api/master-data/sync/full?tenantId=default
  #   运维前台页面：系统管理 → 主数据同步（按域路由 / 手工全量或增量 / 暂停自动调度 / 收件箱 / 权限诊断）
  #     GET  /api/master-data/sync/state                          查看自动调度与同步状态
  #     POST /api/master-data/sync/pause?reason=...               暂停自动调度（定时 + 启动同步）
  #     POST /api/master-data/sync/resume                         恢复自动调度
  master-data:
    # 默认提供者: local(本地库，默认) / http(通用REST目录接口)
    provider: ${MASTER_DATA_PROVIDER:local}
    # 按域覆盖提供者，key 取 users/roles/orgs/positions/employees/auths；留空表示全部走默认提供者
    # 推荐：只把真正由第三方托管的域指向 http（通常 users/orgs/positions/employees），
    #      而 roles/auths 保持 local —— 菜单与权限点始终由本平台维护，第三方只提供角色编码。
    #      另外注意 roles 指向 http 时，门面的"有效角色解析"会把本地用户主键传给第三方（对方无法识别），
    #      属于典型的"配置看着对、结果对不上"陷阱。
    domains: {}
      # users: http
      # orgs: http
      # positions: http
      # employees: http
      # roles: local
      # auths: local
    # 写入策略: LOCAL_ONLY / THIRD_PARTY_WINS(默认，第三方为权威源、本平台只读) / REQUEST_APPROVAL
    write-mode: ${MASTER_DATA_WRITE_MODE:THIRD_PARTY_WINS}
    # 门面读缓存 TTL（秒），0 表示不缓存
    cache-ttl-seconds: ${MASTER_DATA_CACHE_TTL:300}
    # ---- 身份源切换后的"可管理性"保障（避免管理员被锁在门外 / 第三方用户菜单全空）----
    # 本地应急登录账号（break-glass）白名单：身份源切到第三方后，这些账号仍可先用本地口令登录。
    # 为什么需要：users 域切到第三方后凭证校验整体走第三方，若第三方里没有该账号、口令不同或服务不可用，
    #           管理员就会失联 —— 也就没人能登录平台为第三方用户分配菜单权限。
    # 安全边界：仅对显式列出的账号生效，其余账号一律只走第三方，不会退化成任意账号本地登录的绕过通道。
    local-accounts:
      - ${MASTER_DATA_LOCAL_ACCOUNT:admin}
    # 是否把"本地超管账号(source=LOCAL 且 userType=SUPER_ADMIN)"自动视为应急账号（默认开启）
    local-super-admin-break-glass: ${MASTER_DATA_LOCAL_SUPER_ADMIN_BREAK_GLASS:true}
    # JIT 开户/同步后，第三方用户若在本平台一个角色都没有，自动授予的默认角色编码（留空=不授予）。
    # 更推荐的路径：第三方角色会在本地自动建档为"角色壳"，在「角色管理-分配权限」中一次性配置菜单。
    default-role-codes: []
    # 同步第三方角色时是否覆盖本地已分配角色：false(默认)=合并，保留平台内手工授权；true=以第三方为准
    role-replace-on-sync: ${MASTER_DATA_ROLE_REPLACE_ON_SYNC:false}
    # 推送（Webhook/SCIM）接入令牌：为空表示关闭推送入口（默认）
    # 开启后第三方需携带 X-MasterData-Token 头或 token 查询参数调用 /api/master-data/webhook
    webhook-token: ${MASTER_DATA_WEBHOOK_TOKEN:}
    sync:
      # 是否启用定时同步（默认关闭）
      enabled: ${MASTER_DATA_SYNC_ENABLED:false}
      # 启动时自动执行一次全量同步（默认开启，异步执行、不阻塞启动，失败只告警）
      # 作用：保证"切到第三方后，组织/岗位/职工等管理页面能直接看到数据"，无需人工记得点一次同步
      sync-on-startup: ${MASTER_DATA_SYNC_ON_STARTUP:true}
      cron: "${MASTER_DATA_SYNC_CRON:0 0 2 * * ?}"
      # 每批拉取条数
      page-size: ${MASTER_DATA_SYNC_PAGE_SIZE:500}
      # 冲突策略: THIRD_PARTY_WINS(默认) / LOCAL_WINS / MANUAL
      conflict: ${MASTER_DATA_SYNC_CONFLICT:THIRD_PARTY_WINS}
      # 待同步租户，留空时仅同步 default
      tenants: []
      # 第三方已消失的记录是否在本地软删除（enabled=false，绝不物理删除）
      deactivate-missing: ${MASTER_DATA_SYNC_DEACTIVATE_MISSING:false}
      # 演练模式：只统计不落库
      dry-run: ${MASTER_DATA_SYNC_DRY_RUN:false}
      # 推送收件箱兜底消费定时表达式（处理受理后进程重启/失败重试的残留事件）
      inbox-cron: "${MASTER_DATA_SYNC_INBOX_CRON:0 */5 * * * ?}"
      # ---- 推模式（Webhook / SCIM 回调）收件箱 ----
      # 收件接口共享令牌（请求头 X-Master-Data-Token）；为空表示该入口关闭（返回403）
      inbox-token: ${MASTER_DATA_INBOX_TOKEN:}
      # 收件箱轮询间隔（毫秒）
      inbox-poll-ms: ${MASTER_DATA_INBOX_POLL_MS:30000}
      # 单轮消费条数上限
      inbox-batch-size: ${MASTER_DATA_INBOX_BATCH_SIZE:200}
      # 已处理事件保留天数（<=0 表示不清理）
      # 收件箱只增不减（幂等去重 + 可重放），必须按留存策略裁剪，否则几个月就会到百万级。
      # 只清理 PROCESSED；PENDING 待重试、FAILED 待人工重放，都不会被删。
      inbox-retention-days: ${MASTER_DATA_INBOX_RETENTION_DAYS:30}
      # 收件箱清理任务定时表达式（默认每日 03:30）
      inbox-cleanup-cron: "${MASTER_DATA_INBOX_CLEANUP_CRON:0 30 3 * * ?}"
    providers:
      http:
        # 第三方基础地址；为空表示该提供者未启用（不影响启动，调用时才报错）
        base-url: ${MASTER_DATA_HTTP_BASE_URL:}
        # Bearer Token（生产环境建议通过环境变量注入）
        token: ${MASTER_DATA_HTTP_TOKEN:}
        # 自定义请求头，例如 X-Tenant-Id
        headers: {}
        # 字段映射：本地DTO字段 -> 第三方JSON字段（仅顶层重命名）
        field-mapping: {}
        # 连接/读取超时（毫秒）
        timeout-ms: ${MASTER_DATA_HTTP_TIMEOUT_MS:5000}
        # 各端点相对路径，{id} 等为占位符
        paths:
          users: /users
          user-by-username: /users/by-username
          user-by-id: /users/{id}
          user-by-external-id: /users/by-external-id
          roles: /roles
          role-by-id: /roles/{id}
          role-by-code: /roles/by-code
          orgs: /orgs
          org-by-id: /orgs/{id}
          org-tree: /orgs/tree
          org-children: /orgs/children
          org-by-code: /orgs/by-code
          org-by-external-id: /orgs/by-external-id
          positions: /positions
          position-by-id: /positions/{id}
          position-by-code: /positions/by-code
          position-assign: /employees/{id}/positions
          employees: /employees
          employee-by-id: /employees/{id}
          employee-by-external-id: /employees/by-external-id
          employees-by-org: /employees/by-org
          effective-roles: /users/effective-roles
          authenticate: /auth/verify
          sync-pull: /sync/changes

logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

