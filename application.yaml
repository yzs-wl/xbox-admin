server:
  port: 8080
spring:
  application:
    name: xbox-admin
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:xxx@163.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
#default system account  admin/admin123
#default tenant account  xbox/xbox123
xbox:
  session:
    store-type: ${SESSION_STORE_TYPE:memory}
    cache:
      store-type: ${XBOX_CACHE_STORE_TYPE:caffeine}
    tenant:
      max-count: ${XBOX_TENANT_MAX_COUNT:0}
      max-users-per-tenant: ${XBOX_TENANT_MAX_USERS:0}
    security:
      security:
      allowed-hosts: localhost,127.0.0.1,xbox-admin.icu,www.xbox-admin.icu
      cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:,https://xbox-admin.icu,https://www.xbox-admin.icu,http://xbox-admin.icu,http://www.xbox-admin.icu,https://localhost:3000,https://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB