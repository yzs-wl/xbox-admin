    #   feishu:
    #     type: oauth2
    #     client-id: ${SSO_FEISHU_APP_ID:}
    #     client-secret: ${SSO_FEISHU_APP_SECRET:}
    #     authorization-uri: https://open.feishu.cn/open-apis/authen/v1/authorize?app_id={client_id}&redirect_uri={redirect_uri}
    #     token-uri: https://open.feishu.cn/open-apis/authen/v1/access_token
    #     user-info-uri: https://open.feishu.cn/open-apis/authen/v1/user_info
