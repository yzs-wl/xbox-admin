server:
  port: 8080

spring:
  application:
    name: xbox-admin
  # ==================== 服务注册中心（Nacos / CSE / Consul，全部默认关闭，独立运行不受影响） ====================
  # 统一实现：config/registry 包下三个客户端均使用 HTTP Open API 注册（JDK HttpClient），
  # 不引入任何注册中心 SDK 依赖，兼容 GraalVM Native Image。三者可同时启用（多注册中心并存）。
  cloud:
    # ---------------- Nacos（HTTP Open API） ----------------
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        metadata:
          env: ${NACOS_SERVICE_ENV:default}
          version: ${NACOS_SERVICE_VERSION:1.0.0}

    # ---------------- CSE（华为云 CSE / ServiceComb Service Center，HTTP Open API） ----------------
    cse:
      # 鉴权令牌（开启鉴权时必填；为空则不发送鉴权头）
      token: ${CSE_TOKEN:}
      # 鉴权头名称与前缀：华为云 CSE 2.x 用 Authorization + "Bearer "；自建 Service Center 常用 X-Auth-Token + 空前缀
      auth-header: ${CSE_AUTH_HEADER:Authorization}
      token-prefix: ${CSE_TOKEN_PREFIX:Bearer }
      discovery:
        enabled: ${CSE_DISCOVERY_ENABLED:false}
        # 注册中心地址：https://cse.cn-north-4.myhuaweicloud.com 或自建 http://127.0.0.1:30100
        server-addr: ${CSE_ADDR:http://127.0.0.1:30100}
        # 项目ID（华为云必填；自建 Service Center 用 default）
        project-id: ${CSE_PROJECT_ID:default}
        app-id: ${CSE_APP_ID:default}
        service-name: ${CSE_SERVICE_NAME:${spring.application.name}}
        version: ${CSE_SERVICE_VERSION:1.0.0}
        environment: ${CSE_ENVIRONMENT:}
        # 多租户标识（华为云 CSE 需要时填写，会作为 X-Consumer-Tenant 发送）
        tenant: ${CSE_TENANT:}
        ip: ${CSE_IP:}
        port: ${CSE_PORT:}
        status: ${CSE_STATUS:UP}
        # 健康检查：push=客户端定时心跳（默认）；pull=服务端探测；none=不检查
        health-check-mode: ${CSE_HEALTH_CHECK_MODE:push}
        health-check-interval: ${CSE_HEALTH_CHECK_INTERVAL:30}
        health-check-times: ${CSE_HEALTH_CHECK_TIMES:3}
        # 注销时是否顺带删除微服务定义（多实例共享时保持 false）
        delete-microservice: ${CSE_DELETE_MICROSERVICE:false}
        # 数据中心信息。注意：Service Center / 华为云 CSE 对 DataCenterInfo 的
        # name / region / availableZone 三者施加了同一套校验
        # （Min:1 / Max:128 / ^[A-Za-z0-9_.-]+$），传空串或省略字段都会导致注册 400
        # （省略时服务端反序列化为空串，一样报 invalid value ''）。
        # 因此三者留空时都会自动兜底：region 优先从 server-addr 推导
        # （cse.<region>.myhuaweicloud.com → <region>），推导不出则回退 default；
        # name / availableZone 直接回退 default。需要固定值时显式设置对应环境变量。
        datacenter:
          name: ${CSE_DATACENTER_NAME:default}
          region: ${CSE_DATACENTER_REGION:}
          available-zone: ${CSE_DATACENTER_ZONE:}
        metadata:
          env: ${CSE_SERVICE_ENV:default}
          version: ${CSE_SERVICE_VERSION:1.0.0}

    # ---------------- Consul（Agent HTTP API） ----------------
    consul:
      scheme: ${CONSUL_SCHEME:http}
      host: ${CONSUL_HOST:127.0.0.1}
      port: ${CONSUL_PORT:8500}
      # ACL Token（Consul 开启 ACL 时必填）
      token: ${CONSUL_TOKEN:}
      datacenter: ${CONSUL_DATACENTER:}
      discovery:
        enabled: ${CONSUL_DISCOVERY_ENABLED:false}
        # 企业版命名空间（OSS 版留空）
        namespace: ${CONSUL_NAMESPACE:}
        service-name: ${CONSUL_SERVICE_NAME:${spring.application.name}}
        instance-id: ${CONSUL_INSTANCE_ID:}
        ip: ${CONSUL_IP:}
        port: ${CONSUL_SERVICE_PORT:}
        tags: ${CONSUL_TAGS:}
        # 健康检查：配置 health-check-url 则用 HTTP 探活（agent 主动探测，无客户端心跳）；
        # 否则使用 TTL 检查（由客户端定时 check/pass 续期）
        health-check-url: ${CONSUL_HEALTH_CHECK_URL:}
        health-check-interval: ${CONSUL_HEALTH_CHECK_INTERVAL:10s}
        health-check-timeout: ${CONSUL_HEALTH_CHECK_TIMEOUT:3s}
        health-check-critical-timeout: ${CONSUL_HEALTH_CHECK_CRITICAL_TIMEOUT:1m}
        ttl: ${CONSUL_TTL:15s}
        metadata:
          env: ${CONSUL_SERVICE_ENV:default}
          version: ${CONSUL_SERVICE_VERSION:1.0.0}
  datasource:
    # ==================== 数据库（支持 H2 / MySQL / PostgreSQL，驱动均已内置） ====================
    # 切换方式：放开对应 url/driver-class-name/username/password 三行，注释掉其余即可；
    # Hibernate 方言会自动识别，无需手工配置 hibernate.dialect。
    #
    # --- H2（默认，零依赖，数据落在 ./data/xbox-admin.mv.db） ---
    url: ${DB_URL:jdbc:h2:file:./data/xbox-admin}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    #
    # --- MySQL 8 示例 ---
    #url: ${DB_URL:jdbc:mysql://localhost:3306/xbox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    #driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    #username: ${DB_USERNAME:root}
    #password: ${DB_PASSWORD:root}
    #
    # --- PostgreSQL 示例（建议 12+，需先 CREATE DATABASE xbox） ---
    #url: ${DB_URL:jdbc:postgresql://localhost:5432/xbox?currentSchema=public&reWriteBatchedInserts=true}
    #driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    #username: ${DB_USERNAME:postgres}
    #password: ${DB_PASSWORD:postgres}
    # ==================== HikariCP 连接池配置（应对高频操作） ====================
    hikari:
      # 连接池最大连接数（默认 10，频繁操作易耗尽，提高到 30）
      maximum-pool-size: 30
      # 最小空闲连接数，保持一定常驻连接避免频繁创建
      minimum-idle: 10
      # 连接空闲超时回收时间（毫秒，默认 600000=10分钟），调小以快速回收空闲连接
      idle-timeout: 600000
      # 连接最大存活时间（毫秒，默认 1800000=30分钟），必须小于数据库 wait_timeout
      max-lifetime: 1800000
      # 从池中获取连接的最长等待时间（毫秒），超时抛异常
      connection-timeout: 30000
      # 连接验证超时（毫秒）
      validation-timeout: 5000
      # 连接测试查询：H2 用 SELECT 1；MySQL 8 与 PostgreSQL 建议改用 JDBC4 isValid()，
      # 即不配置本项（注释掉）由 HikariCP 自动使用 Connection.isValid()
      connection-test-query: SELECT 1
      # 连接池名称
      pool-name: xbox-admin-HikariCP
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # JDBC 批量写入：让同一事务内的多条语句合并发送，减少数据库往返（主数据同步受益）。
        # order_* 按表分组后再批处理，是批量真正生效的前提。
        # 注意：实体主键用的是 IDENTITY 自增，Hibernate 必须逐行取回生成主键，
        #      因此 INSERT 的批处理收益有限（UPDATE 与多语句事务不受此限制）。
        #      若后续要进一步提升同步吞吐，需要改主键策略或走"显式 saveAll + 分批 flush"的批量写路径。
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # 方言留空由 Hibernate 依据 JDBC 元数据自动识别（H2 / MySQL / PostgreSQL 均可）。
        # 仅在需要覆盖时才显式指定，例如：
        #   dialect: org.hibernate.dialect.PostgreSQLDialect
        #   dialect: org.hibernate.dialect.MySQLDialect
        #   dialect: org.hibernate.dialect.H2Dialect
        bytecode:
          provider: none
  sql:
    init:
      mode: never
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
          temperature: 0.7
    # MCP Server 配置（由 spring-ai-starter-mcp-server-webmvc 自动配置）
    mcp:
      server:
        name: ${MCP_SERVER_NAME:xbox-mcp-server}
        version: ${MCP_SERVER_VERSION:1.0.0}
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
  # 邮件通知配置（NotificationService EMAIL 渠道）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # ==================== 定时任务线程池 ====================
  # 项目里所有 @Scheduled（主数据同步、推送收件箱消费与清理、审计完整性摘要、备份等）
  # 共用这一个池。Spring Boot 默认 pool.size=1 —— 主数据增量同步（可能几分钟）
  # 会把同一池里的其它定时任务全部堵住，因此这里放宽到 4。
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: ${SPRING_TASK_SCHEDULING_THREAD_PREFIX:xbox-sched-}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Redis配置（仅在xbox.session.store-type=redis时生效）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:-1ms}

flowable:
  async-executor-activate: false
  # Set to false: schema initialization is handled by FlowableSchemaAutoConfiguration
  # which executes META-INF/db/flowable-mysql-all-create.sql before ProcessEngine starts.
  # This avoids conflicts between Flowable's built-in DDL and our custom SQL script.
  database-schema-update: true
  history-level: full

jwt:
  # 【安全警告】JWT密钥必须通过环境变量JWT_SECRET设置！
  # 系统启动时会校验密钥强度，弱密钥/默认密钥将导致启动警告。
  # 绝不应在生产环境使用默认值，攻击者可用此密钥伪造任意JWT Token。
  secret: ${JWT_SECRET:XboxAdminSecretKeyForJwtTokenGeneration2024VeryLongSecretKey}
  expiration: ${JWT_EXPIRATION:86400000}
  # JWT时钟偏移容忍秒数，防止客户端/服务器时间差导致误判过期
  clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}

# 安全配置
xbox:
  # ==================== 存储层配置（行存 + 列存） ====================
  storage:
    # 是否启用存储路由；false 时一律走行存（列存接入后可一键关闭，回到纯行存行为）
    routing-enabled: ${XBOX_STORAGE_ROUTING_ENABLED:true}
    # AP 判定的最小预估扫描行数
    ap-scan-threshold: ${XBOX_STORAGE_AP_SCAN_THRESHOLD:5000}
    # 投影列 / 模型总列数 的上限比值，超过视为全列扫描，走行存
    projection-ratio: ${XBOX_STORAGE_PROJECTION_RATIO:0.6}
  # 会话存储配置
  session:
    # 存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${SESSION_STORE_TYPE:memory}
  # ==================== 缓存（单机 Caffeine / 集群 Redis） ====================
  # 单机用 Caffeine（零依赖）；集群切 Redis：所有节点共享同一份缓存，
  # 并用 Redis 发布/订阅广播"缓存已失效"，让各节点的进程内缓存也能立即清掉。
  cache:
    # 缓存后端: caffeine(默认，单机内存) / redis(集群共享)
    store-type: ${XBOX_CACHE_STORE_TYPE:caffeine}
    # 缓存 TTL（秒），对应 permissions/roles/menuTree
    ttl-seconds: ${XBOX_CACHE_TTL_SECONDS:600}
    # Redis 缓存键前缀（避免与同实例的其它业务键冲突）
    redis-key-prefix: ${XBOX_CACHE_REDIS_PREFIX:xbox:cache:}
    # 集群间"缓存失效广播"：节点 A 清缓存后通过 Redis Pub/Sub 通知其它节点清<b>本地</b>缓存。
    # 为什么需要：即便缓存后端换成 Redis，各节点仍有进程内缓存（主数据门面的 Caffeine 读缓存），
    # 不广播就只能等 TTL 过期。需要 spring.data.redis.* 可用；Redis 不可用时自动退化为仅本地清理。
    cluster-notify: ${XBOX_CACHE_CLUSTER_NOTIFY:false}
    # 广播频道名
    cluster-channel: ${XBOX_CACHE_CLUSTER_CHANNEL:xbox:cache:evict}
  security:
    # === 总开关：设为 false 关闭全部安全功能（方便性能测试） ===
    enabled: true
    # === 【等保三级-会话治理】 ===
    session:
      # 单用户最大并发会话数：1=新登录互踢（等保推荐）；0=不限制
      max-concurrent-sessions: ${SESSION_MAX_CONCURRENT:1}
      # 空闲超时（分钟）：超时无请求的会话自动失效（等保要求≤30）；0=不启用
      idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:30}
    # === 细粒度开关（仅在 enabled=true 时生效） ===
    # 是否启用请求/响应体加密
    encrypt-body: true
    # 是否启用防篡改签名校验
    sign-enabled: true
    # 是否启用防重放（timestamp + nonce）
    replay-enabled: true
    # 是否启用 Host 头校验（防 Host 头篡改）
    host-check-enabled: true
    # 是否启用 XSS 检测
    xss-enabled: true
    # 是否启用 SQL 注入检测
    sql-injection-enabled: true
    # 是否启用安全响应头（CSP/HSTS/X-Frame-Options 等）
    security-headers-enabled: true
    # 【安全警告】以下密钥必须通过环境变量设置，默认值仅供开发/测试环境使用！
    # 生产环境绝不应使用默认值，否则加密和签名可被攻击者完全破解。
    # HMAC 签名密钥（生产环境请通过环境变量 SIGN_KEY 设置）
    sign-key: ${SIGN_KEY:XboxSignKey2024SecretForHmac}
    # 数据加密 AES 密钥（生产环境请通过环境变量 AES_KEY 设置）
    aes-key: ${AES_KEY:XboxAesKey2024SecretForData}
    # 允许的 Host 头白名单（防 Host 头篡改）
    allowed-hosts: localhost,127.0.0.1
    # CORS 允许的来源域名
    cors-allowed-origins: http://localhost:3000,http://localhost:8080
    # 登录安全策略
    login-policy:
      # 是否启用登录失败锁定
      lock-enabled: ${LOGIN_LOCK_ENABLED:true}
      # 连续登录失败次数阈值
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      # 账号锁定时长（分钟）
      lock-duration-minutes: ${LOGIN_LOCK_DURATION_MINUTES:30}
      # 是否启用密码复杂度校验
      password-complexity-enabled: ${PASSWORD_COMPLEXITY_ENABLED:true}
      # 密码最小长度
      password-min-length: ${PASSWORD_MIN_LENGTH:8}
      # 密码必须包含大写字母
      password-require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
      # 密码必须包含小写字母
      password-require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
      # 密码必须包含数字
      password-require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
      # 密码必须包含特殊字符
      password-require-special: ${PASSWORD_REQUIRE_SPECIAL:true}
      # 密码历史校验：禁止重复使用最近 N 次密码（0 表示不校验）
      password-history-count: ${PASSWORD_HISTORY_COUNT:5}
      # 密码过期天数（0 表示不过期）
      password-expire-days: ${PASSWORD_EXPIRE_DAYS:0}
      # 是否启用登录验证码（图形点击验证，设为 false 可关闭验证码）
      captcha-enabled: ${CAPTCHA_ENABLED:true}
      # 【等保三级】登录接口 IP+用户名维度限流（防分布式撞库，与账号锁定互补）
      login-rate-limit-enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      # 限流窗口内最大尝试次数
      login-rate-limit-max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
      # 限流窗口时长（分钟）
      login-rate-limit-window-minutes: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:5}
    # 通用 API 限流配置
    rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
      # 每用户每周期最大请求数（支持UI批量并发：1主表+10子表≈30并发+重试）
      max-requests: ${API_RATE_LIMIT_MAX:600}
      # 填充周期（秒），600/30=20 req/sec 补充速率
      refill-seconds: ${API_RATE_LIMIT_REFILL:30}
    # 【等保三级-安全审计】审计完整性保护与留存策略
    audit:
      # 审计记录留存天数（等保三级要求≥180天，配置小于180时按180执行）
      retention-days: ${AUDIT_RETENTION_DAYS:365}
      # 每日链式哈希摘要生成时间（默认每日 02:20，含历史缺失日期补算）
      digest-cron: ${AUDIT_DIGEST_CRON:0 20 2 * * ?}
      # 超留存期审计记录清理时间（默认每日 02:40）
      cleanup-cron: ${AUDIT_CLEANUP_CRON:0 40 2 * * ?}

  # 【等保三级-数据备份恢复】数据库备份配置
  backup:
    # 是否启用定时备份（生产环境建议开启，prod profile 默认开启）
    enabled: ${BACKUP_ENABLED:false}
    # 备份文件目录
    dir: ${BACKUP_DIR:./data/backup}
    # 备份文件保留天数
    retention-days: ${BACKUP_RETENTION_DAYS:30}
    # 备份失败告警接收邮箱（空则不发送告警）
    notify-email: ${BACKUP_NOTIFY_EMAIL:}
    # 定时备份时间（默认每日 03:30）
    cron: ${BACKUP_CRON:0 30 3 * * ?}

  # 幂等性防重复提交配置
  idempotent:
    # 是否启用幂等性校验
    enabled: ${IDEMPOTENT_ENABLED:true}
    # 幂等键有效期（秒）
    expire-seconds: ${IDEMPOTENT_EXPIRE_SECONDS:300}
    # 需要幂等校验的路径模式（逗号分隔）
    include-patterns: ${IDEMPOTENT_INCLUDE_PATTERNS:POST:/api/users,POST:/api/roles,POST:/api/organizations,POST:/api/employees,POST:/api/groups,POST:/api/auths,POST:/api/tenants}

  # SSO 单点登录配置
  sso:
    # 是否启用 SSO（默认关闭，需配置 provider 后启用）
    enabled: ${SSO_ENABLED:false}
    # SSO 登录后自动创建本地用户
    auto-create-user: ${SSO_AUTO_CREATE_USER:true}
    # SSO 登录后自动分配的默认角色编码（逗号分隔）
    default-roles: ${SSO_DEFAULT_ROLES:user}
    # SSO 提供方配置（每个 provider 为一个独立的配置块）
    # 启用 SSO 时需至少配置一个 provider，登录页面将自动显示对应 SSO 按钮。
    #
    # === Keycloak OIDC 示例 ===
    # providers:
    #   keycloak:
    #     type: oidc
    #     client-id: ${SSO_KEYCLOAK_CLIENT_ID:xbox-app}
    #     client-secret: ${SSO_KEYCLOAK_CLIENT_SECRET:}
    #     issuer-uri: ${SSO_KEYCLOAK_ISSUER_URI:https://keycloak.example.com/realms/xbox}
