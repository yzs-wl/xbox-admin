server:
  port: 8888
spring:
  application:
    name: xbox-admin
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
xbox:
  config:
    crypto:
      enabled: ${XBOX_CONFIG_CRYPTO_ENABLED:true}
      key: ${XBOX_CONFIG_CRYPTO_KEY:}
  session:
    # 存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${SESSION_STORE_TYPE:memory}
  cache:
    # 缓存后端: caffeine(默认，单机内存) / redis(集群共享)
    store-type: ${XBOX_CACHE_STORE_TYPE:caffeine}
  tenant:
    max-count: ${XBOX_TENANT_MAX_COUNT:0}
    max-users-per-tenant: ${XBOX_TENANT_MAX_USERS:0}
  security:
    allowed-hosts: localhost,127.0.0.1,xbox-admin.icu,www.xbox-admin.icu
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://xbox-admin.icu,https://www.xbox-admin.icu,http://xbox-admin.icu,http://www.xbox-admin.icu,https://localhost:80,https://localhost:8888,http://127.0.0.1:80,http://127.0.0.1:8888}
logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB