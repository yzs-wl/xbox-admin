server:
  port: 8888
spring:
  application:
    name: xbox-admin
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:xxx@163.com}
    password: ${MAIL_PASSWORD:ENC(MAIL_PASSWORD)}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            socketFactory:
              port: 465
              class: javax.net.ssl.SSLSocketFactory
#default system account  admin/admin123
#default tenant account  xbox/xbox123
xbox:
  config:
    crypto:
      enabled: ${XBOX_CONFIG_CRYPTO_ENABLED:true}
      key: ${XBOX_CONFIG_CRYPTO_KEY:ULvD3M8z6xIBoMnLxMo1Ew7RDDgPZz3MfrV6g05ll4A=}
  session:
    store-type: ${SESSION_STORE_TYPE:memory}
  cache:
    store-type: ${XBOX_CACHE_STORE_TYPE:caffeine}
  tenant:
    max-count: ${XBOX_TENANT_MAX_COUNT:0}
    max-users-per-tenant: ${XBOX_TENANT_MAX_USERS:0}
  mobile:
    voice:
      asr:
        tencent:
          secret-id: ${TENCENT_ASR_SECRET_ID:ENC(TENCENT_ASR_SECRET_ID)}
          secret-key: ${TENCENT_ASR_SECRET_KEY:ENC(TENCENT_ASR_SECRET_KEY)}
  security:
    allowed-hosts: localhost,127.0.0.1,159.75.52.18,xbox-admin.icu,www.xbox-admin.icu
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://159.75.52.18,https://xbox-admin.icu,https://www.xbox-admin.icu,http://159.75.52.18,http://xbox-admin.icu,http://www.xbox-admin.icu,https://localhost:80,https://localhost:8888,http://127.0.0.1:80,http://127.0.0.1:8888}
logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB