server:
  port: 8888
spring:
  application:
    name: xbox-admin
xbox:
  security:
    allowed-hosts: localhost,127.0.0.1,159.75.52.18
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://159.75.52.1:80,http://localhost:80,http://127.0.0.1:80,http://127.0.0.1:8888,http://localhost:8888,http://159.75.52.18:8888}
logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB

