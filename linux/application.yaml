server:
  address: 127.0.0.1
  port: 8888
spring:
  application:
    name: xbox-admin
xbox:
  session:
    # 存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${SESSION_STORE_TYPE:memory}
  cache:
    # 缓存后端: caffeine(默认，单机内存) / redis(集群共享)
    store-type: ${XBOX_CACHE_STORE_TYPE:caffeine}
  tenant:
    max-count: ${XBOX_TENANT_MAX_COUNT:100}
    max-users-per-tenant: ${XBOX_TENANT_MAX_USERS:100}
  security:
    security-headers-enabled: false
    allowed-hosts: localhost,127.0.0.1
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}
rag:
    enabled: ${RAG_ENABLED:true}
    # 向量存储类型: memory(默认，内存存储，单机模式) / redis(Redis存储，集群模式)
    store-type: ${RAG_STORE_TYPE:memory}
logging:
  level:
    org.xbox: INFO
  file:
    path: ./logs
    name: ./logs/xbox-admin.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB